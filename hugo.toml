baseURL = "https://syn0126.github.io/"
title = "小龙的博客"
defaultContentLanguage = "zh-cn"
locale = "zh-CN"

# Tags and categories are disabled until the site actually uses them.
disableKinds = ["taxonomy", "term"]

# Output formats
[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  page = ["HTML"]

# Clean URLs: /hello-world/ instead of /posts/hello-world/
[permalinks]
  posts = "/:slug/"

# Resolve date from frontmatter first, then from filename (YYYY-MM-DD format)
[frontmatter]
  date = ["date", ":filename"]
  lastmod = [":git", "lastmod", "date"]
  publishDate = ["publishDate", "date"]

# Markdown rendering (safe mode — no raw HTML in posts)
[markup.goldmark.renderer]
  unsafe = false

# Site metadata
[params]
  author = "小龙"
  description = "记录思考，分享观点。"
  defaultImage = "/images/social-card.jpg"
